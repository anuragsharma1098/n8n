name: n8n

services:
  postgres:
    # Pinned to major version 18: a newer major version can't read this data without an upgrade.
    image: postgres:18-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # Version is set by N8N_VERSION in .env.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    ports:
      # Reachable only from this PC. Use "5678:5678" to expose it to your network.
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      # URL n8n shows for webhook nodes. Change it if you put n8n behind a tunnel (ngrok, Cloudflare Tunnel).
      - N8N_WEBHOOK_URL=http://localhost:5678/
      # Let the "Read/Write Files from Disk" node use ./local-files (mounted at /files).
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Code nodes run in the task-runners container below.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      # Holds the encryption key for saved credentials. Back it up together with the database.
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  task-runners:
    # Runs JavaScript and Python Code nodes. Must be the same version as n8n.
    image: n8nio/runners:${N8N_VERSION}
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - GENERIC_TIMEZONE=Asia/Kolkata
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5680/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: n8n-adminer
    restart: unless-stopped
    ports:
      # Open http://localhost:8080/?pgsql=postgres&username=n8n&db=n8n
      # The login is pre-filled; the password is POSTGRES_PASSWORD in .env.
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres

volumes:
  n8n_data:
    name: n8n_data
  postgres_data:
    name: n8n_postgres_data
