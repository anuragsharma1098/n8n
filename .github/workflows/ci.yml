name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Check the workflow files
        run: pytest -m "not e2e"

      - name: Check docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Lint this workflow file
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  e2e:
    name: End-to-end tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Create .env with random secrets
        run: python scripts/create_env.py

      - name: Start n8n, Postgres, Adminer and the task runners
        run: docker compose up -d --wait --wait-timeout 300

      - name: Install the QA workflows
        run: python scripts/install_workflows.py

      - name: Check the workflow files match what n8n stores
        run: |
          python scripts/export_workflows.py
          git diff --exit-code -- workflows/

      - name: Run the end-to-end tests
        run: pytest -m e2e --junitxml=reports/junit.xml

      # Dogfooding: this pipeline's own test results go through the quality gate,
      # and its verdict appears on the run's summary page.
      # Values go through env, not straight into the script: branch names come from pull requests.
      - name: Send this run's results to the quality gate
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        env:
          PROJECT: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          python scripts/publish_results.py reports/junit.xml
          --project "$PROJECT" --branch "$BRANCH" --commit "$COMMIT"
          --build-url "$BUILD_URL" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: ignore

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
